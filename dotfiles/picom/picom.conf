# ============================================================
#  Picom — Everforest | Modern | Animations + Transparency
# ============================================================

backend = "glx";
vsync = true;

# GLX
use-damage = true;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.3;
shadow-color = "#000000";

shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'Rofi'",
    "window_type = 'dock'",
    "window_type = 'menu'",
    "window_type = 'popup_menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'tooltip'",
];

# Opacity
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
    "100:class_g = 'Polybar'",
    "100:class_g = 'Rofi'",
    "95:class_g = 'Alacritty' && focused",
    "85:class_g = 'Alacritty' && !focused",
];

# Blur
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;
blur-method = "dual_kawase";
blur-strength = 6;

blur-background-exclude = [
    "window_type = 'dock'",
    "class_g = 'Polybar'",
    "class_g = 'Rofi'",
];

# Corners
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "class_g = 'Polybar'",
    "class_g = 'i3lock'",
];

# Fading
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

# ============================================================
#  ANIMATIONS (modern picom syntax)
# ============================================================

animations = ({
    triggers = [ "open", "show" ];
    preset = "slide-down";
    duration = 0.15;
    scale = 0.95;
}, {
    triggers = [ "close", "hide" ];
    preset = "slide-up";
    duration = 0.15;
}, {
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.12;
});

animation-exclude = [
    "class_g = 'i3lock'",
    "class_g = 'Rofi'",
    "class_g = 'Polybar'",
];
