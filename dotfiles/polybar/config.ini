; ============================================================
;  Polybar — Everforest Dark Laptop
;  Floating | Rounded | Transparent | i3wm
; ============================================================

[colors]
bg        = #cc2b3339
bg-alt    = #aa323c41
fg        = #d3c6aa
fg-alt    = #9da9a0

green     = #a7c080
aqua      = #7fbbb3
yellow    = #dbbc7f
orange    = #e69875
red       = #e67e80
purple    = #d699b6
grey      = #859289

trans     = #00000000

[bar/main]
monitor = ${env:MONITOR:}
width = 98%
height = 36
offset-x = 1%
offset-y = 6
radius = 12.0
fixed-center = true

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 2
line-color = ${colors.aqua}

border-size = 0
border-color = ${colors.trans}

padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 2

; Float on top — i3 gaps reserves the space instead
override-redirect = true

font-0 = "JetBrainsMono Nerd Font:size=11;3"
font-1 = "JetBrainsMono Nerd Font:size=13;3"
font-2 = "JetBrainsMono Nerd Font:size=15;4"

modules-left   = xworkspaces xwindow
modules-center = date
modules-right  = cpu memory temperature battery backlight volume network bluetooth powermenu

cursor-click = pointer
cursor-scroll = ns-resize

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.bg-alt}
label-active-underline = ${colors.aqua}
label-active-padding = 2

label-occupied = %name%
label-occupied-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.grey}
label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:45:...%
label-padding = 1
label-foreground = ${colors.fg-alt}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.green}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰘚 "
format-prefix-foreground = ${colors.purple}
label = %percentage_used:2%%

[module/temperature]
type = internal/temperature
hwmon-path = /sys/class/hwmon/hwmon0/temp1_input
base-temperature = 40
warn-temperature = 80
format = <label>
format-prefix = "󰔏 "
format-prefix-foreground = ${colors.orange}
label = %temperature-c%
format-warn = <label-warn>
format-warn-prefix = "󰔏 "
format-warn-prefix-foreground = ${colors.red}
label-warn = %temperature-c%
label-warn-foreground = ${colors.red}

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 98
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-charging-foreground = ${colors.green}
label-full-foreground = ${colors.green}
ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂
ramp-capacity-foreground = ${colors.yellow}
animation-charging-0 = 󰢟
animation-charging-1 = 󰂆
animation-charging-2 = 󰂇
animation-charging-3 = 󰂈
animation-charging-4 = 󰢝
animation-charging-foreground = ${colors.green}
animation-charging-framerate = 750

[module/backlight]
type = internal/backlight
card = amdgpu_bl2
use-actual-brightness = true
enable-scroll = true
format = <label>
format-prefix = "󰃟 "
format-prefix-foreground = ${colors.yellow}
label = %percentage%%

[module/volume]
type = custom/script
exec = ~/.config/polybar/scripts/volume.sh
interval = 1
click-left = ~/.config/polybar/scripts/volume.sh --toggle
scroll-up = ~/.config/polybar/scripts/volume.sh --up
scroll-down = ~/.config/polybar/scripts/volume.sh --down
click-right = pavucontrol

[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 5
click-left = nm-connection-editor

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 2
click-left = blueman-manager

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d
time = %H:%M
label = %date%  %time%

[module/powermenu]
type = custom/menu
expand-right = true
format-spacing = 1
label-open = "󰐥"
label-open-foreground = ${colors.red}
label-close = "󰅖 cancel"
label-close-foreground = ${colors.fg}
label-separator = |
label-separator-foreground = ${colors.grey}

menu-0-0 = "󰍁 lock"
menu-0-0-exec = i3lock-fancy
menu-0-1 = "󰒲 sleep"
menu-0-1-exec = systemctl suspend
menu-0-2 = "󰜉 reboot"
menu-0-2-exec = systemctl reboot
menu-0-3 = "󰐥 poweroff"
menu-0-3-exec = systemctl poweroff
menu-0-3-foreground = ${colors.red}

[settings]
screenchange-reload = true
pseudo-transparency = false

[global/wm]
margin-top = 0
margin-bottom = 0
